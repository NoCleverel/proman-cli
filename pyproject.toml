[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "proman-cli"
version = "0.3.0"
description = "Standardized Git workflow + project launcher + deploy keys."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "cleverel" }]
dependencies = ["typer>=0.12.0", "rich>=13.0.0"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-mock>=3"]

[project.scripts]
proman = "proman.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/man/man1" = ["docs/proman.1"]
